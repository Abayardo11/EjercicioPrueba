<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sin conexión</title>


    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }


        .contenedor {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }


        h1 {
            margin-bottom: 10px;
        }


        p {
            color: #555;
        }


        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background-color: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

    </style>

</head>


<body>


    <div class="contenedor">

        <h1>Sin conexión</h1>

        <p>
            No tienes conexión a internet.
        </p>

        <p>
            Conéctate a internet para continuar usando la aplicación.
        </p>


        <button onclick="reintentar()">
            Reintentar
        </button>

    </div>



    <script>

        function reintentar() {

            if (navigator.onLine) {

                window.location.href = "index.html";

            }

            else {

                alert("Todavía no tienes conexión a internet.");

            }

        }


        // Cuando regrese el internet,
        // regresar automáticamente a la aplicación

        window.addEventListener("online", function() {

            window.location.href = "index.html";

        });

    </script>


</body>

</html>
