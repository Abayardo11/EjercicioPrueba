<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Lista</title>

    <link rel="manifest" href="implementacion.json">


    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f2f2f2;
        }


        .contenedor {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }


        h1 {
            text-align: center;
        }


        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }


        button {
            padding: 11px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }


        .boton-principal {
            width: 100%;
            background-color: #1877f2;
            color: white;
            font-size: 16px;
        }


        .boton-crear {
            width: 100%;
            background-color: #42b72a;
            color: white;
            font-size: 16px;
        }


        .boton-regresar {
            width: 100%;
            background-color: #777;
            color: white;
            font-size: 16px;
            margin-top: 10px;
        }


        .mensaje-registro {
            text-align: center;
            margin-top: 20px;
        }


        .separador {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }


        .contenedor-tarea {
            display: flex;
            gap: 10px;
        }


        .contenedor-tarea input {
            margin-bottom: 0;
        }


        .boton-agregar {
            background-color: #1877f2;
            color: white;
            white-space: nowrap;
        }


        .tarea {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ddd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
        }


        .tarea span {
            word-break: break-word;
        }


        .boton-eliminar {
            background-color: #e74c3c;
            color: white;
            margin-left: 10px;
        }


        .boton-cerrar {
            width: 100%;
            background-color: #777;
            color: white;
            margin-top: 20px;
        }


        #registro {
            display: none;
        }


        #app {
            display: none;
        }


        #mensaje {
            text-align: center;
            color: red;
        }


        #mensajeRegistro {
            text-align: center;
            color: red;
        }

    </style>

</head>


<body>


    <div class="contenedor">


        <!-- INICIO DE SESIÓN -->

        <div id="login">

            <h1>Mi Lista</h1>

            <h2>Iniciar sesión</h2>


            <input
                type="email"
                id="emailLogin"
                placeholder="Correo electrónico">


            <input
                type="password"
                id="passwordLogin"
                placeholder="Contraseña">


            <button
                class="boton-principal"
                onclick="iniciarSesion()">

                Iniciar sesión

            </button>


            <hr class="separador">


            <div class="mensaje-registro">

                <p>¿No tienes una cuenta?</p>


                <button
                    class="boton-crear"
                    onclick="mostrarRegistro()">

                    Crear una nueva cuenta

                </button>

            </div>


            <p id="mensaje"></p>

        </div>



        <!-- CREAR CUENTA -->

        <div id="registro">

            <h1>Crear cuenta</h1>


            <input
                type="text"
                id="nombre"
                placeholder="Tu nombre">


            <input
                type="email"
                id="email"
                placeholder="Correo electrónico">


            <input
                type="password"
                id="password"
                placeholder="Contraseña">


            <button
                class="boton-crear"
                onclick="crearCuenta()">

                Crear cuenta

            </button>


            <button
                class="boton-regresar"
                onclick="mostrarLogin()">

                Regresar al inicio de sesión

            </button>


            <p id="mensajeRegistro"></p>

        </div>



        <!-- APLICACIÓN -->

        <div id="app">

            <h1>Mi Lista</h1>


            <p id="usuario"></p>


            <!-- AGREGAR TAREA -->

            <div class="contenedor-tarea">

                <input
                    type="text"
                    id="textoTarea"
                    placeholder="Escribe una tarea">

                <button
                    class="boton-agregar"
                    onclick="agregarTarea()">

                    Agregar

                </button>

            </div>


            <!-- TAREAS -->

            <div id="lista"></div>


            <!-- CERRAR SESIÓN -->

            <button
                class="boton-cerrar"
                onclick="cerrarSesion()">

                Cerrar sesión

            </button>

        </div>


    </div>



    <!-- FIREBASE MODULAR -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


        import {
            getDatabase,
            ref,
            push,
            onValue,
            remove
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";



        // CONFIGURACIÓN DE FIREBASE

        const firebaseConfig = {

            apiKey: "AIzaSyATiJwpfYrsnEbVGtnuZxklN-XFUs7szjw",

            authDomain: "ejerciciopruebaa.firebaseapp.com",

            databaseURL: "https://ejerciciopruebaa-default-rtdb.firebaseio.com",

            projectId: "ejerciciopruebaa",

            storageBucket: "ejerciciopruebaa.firebasestorage.app",

            messagingSenderId: "936617415497",

            appId: "1:936617415497:web:82324a47c68c73f4a88098"

        };


        // INICIAR FIREBASE

        const app = initializeApp(firebaseConfig);


        // INICIAR AUTHENTICATION

        const auth = getAuth(app);


        // INICIAR REALTIME DATABASE

        const db = getDatabase(app);


        let tareasRef = null;

        let dejarDeEscucharTareas = null;



        // MOSTRAR REGISTRO

        window.mostrarRegistro = function() {

            document.getElementById("login").style.display = "none";

            document.getElementById("registro").style.display = "block";

            document.getElementById("mensaje").innerText = "";

        };



        // MOSTRAR LOGIN

        window.mostrarLogin = function() {

            document.getElementById("login").style.display = "block";

            document.getElementById("registro").style.display = "none";

            document.getElementById("mensajeRegistro").innerText = "";

        };



        // CREAR CUENTA

        window.crearCuenta = function() {

            let nombre =
                document.getElementById("nombre").value;

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;


            if (nombre == "" || email == "" || password == "") {

                document.getElementById("mensajeRegistro").innerText =
                    "Completa todos los campos.";

                return;

            }


            createUserWithEmailAndPassword(
                auth,
                email,
                password
            )

            .then(function(resultado) {

                return updateProfile(
                    resultado.user,
                    {
                        displayName: nombre
                    }
                );

            })

            .catch(function(error) {

                document.getElementById("mensajeRegistro").innerText =
                    error.message;

            });

        };



        // INICIAR SESIÓN

        window.iniciarSesion = function() {

            let email =
                document.getElementById("emailLogin").value;

            let password =
                document.getElementById("passwordLogin").value;


            if (email == "" || password == "") {

                document.getElementById("mensaje").innerText =
                    "Escribe tu correo y contraseña.";

                return;

            }


            signInWithEmailAndPassword(
                auth,
                email,
                password
            )

            .catch(function(error) {

                document.getElementById("mensaje").innerText =
                    error.message;

            });

        };



        // DETECTAR USUARIO

        onAuthStateChanged(auth, function(user) {

            if (user) {

                mostrarAplicacion(user);

            }

            else {

                document.getElementById("login").style.display = "block";

                document.getElementById("registro").style.display = "none";

                document.getElementById("app").style.display = "none";

            }

        });



        // MOSTRAR APLICACIÓN

        function mostrarAplicacion(user) {

            document.getElementById("login").style.display = "none";

            document.getElementById("registro").style.display = "none";

            document.getElementById("app").style.display = "block";


            document.getElementById("usuario").innerText =
                "Hola, " + (user.displayName || user.email);


            // RUTA DE LAS TAREAS DEL USUARIO

            tareasRef = ref(
                db,
                "usuarios/" + user.uid + "/tareas"
            );


            escucharTareas();

        }



        // ESCUCHAR TAREAS

        function escucharTareas() {

            if (dejarDeEscucharTareas) {

                dejarDeEscucharTareas();

            }


            dejarDeEscucharTareas = onValue(
                tareasRef,
                function(snapshot) {

                    let lista =
                        document.getElementById("lista");


                    lista.innerHTML = "";


                    snapshot.forEach(function(tarea) {

                        let datos = tarea.val();


                        let div =
                            document.createElement("div");


                        div.className = "tarea";


                        let texto =
                            document.createElement("span");


                        texto.innerText = datos.texto;


                        let boton =
                            document.createElement("button");


                        boton.innerText = "Eliminar";

                        boton.className = "boton-eliminar";


                        boton.onclick = function() {

                            eliminarTarea(tarea.key);

                        };


                        div.appendChild(texto);

                        div.appendChild(boton);

                        lista.appendChild(div);

                    });

                }
            );

        }



        // AGREGAR TAREA

        window.agregarTarea = function() {

            let input =
                document.getElementById("textoTarea");


            let texto = input.value;


            if (texto == "") {

                return;

            }


            push(
                tareasRef,
                {
                    texto: texto,
                    fecha: Date.now()
                }
            );


            input.value = "";

        };



        // ELIMINAR TAREA

        window.eliminarTarea = function(id) {

            let tareaRef = ref(
                db,
                "usuarios/" +
                auth.currentUser.uid +
                "/tareas/" +
                id
            );


            remove(tareaRef);

        };



        // CERRAR SESIÓN

        window.cerrarSesion = function() {

            if (dejarDeEscucharTareas) {

                dejarDeEscucharTareas();

            }


            signOut(auth);

        };

    </script>



    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register("wifioff.js");

        }


        // DETECTAR PÉRDIDA DE INTERNET

        window.addEventListener("offline", function() {

            window.location.href = "offline.html";

        });

    </script>


</body>

</html>
