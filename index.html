<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Lista</title>

    <link rel="manifest" href="implementacion.json">
</head>

<body>

    <div class="contenedor">

        <h1>Mi Lista</h1>

        <div class="entrada">

            <input type="text" id="texto" placeholder="Escribe algo">

            <button onclick="agregar()">Agregar</button>

        </div>

        <ul id="lista"></ul>

        <p id="estado">Conectando...</p>

    </div>


    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f2f2f2;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .entrada {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-top: 10px;
            background-color: #eeeeee;
            border-radius: 5px;
        }

        #estado {
            font-size: 14px;
        }

        @media (max-width: 500px) {

            .entrada {
                flex-direction: column;
            }

            li {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }

        }

    </style>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


    <script>

        // Configuración de Firebase

        const firebaseConfig = {

            apiKey: "AIzaSyATiJwpfYrsnEbVGtnuZxklN-XFUs7szjw",

            authDomain: "ejerciciopruebaa.firebaseapp.com",

            databaseURL: "https://ejerciciopruebaa-default-rtdb.firebaseio.com",

            projectId: "ejerciciopruebaa",

            storageBucket: "ejerciciopruebaa.firebasestorage.app",

            messagingSenderId: "936617415497",

            appId: "1:936617415497:web:82324a47c68c73f4a88098"

        };


        // Iniciar Firebase

        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();


        // Referencia de las tareas

        const tareasRef = db.ref("tareas");


        // Lista local

        let elementos = JSON.parse(localStorage.getItem("elementos")) || [];


        // Mostrar lista

        mostrar();


        function mostrar() {

            let lista = document.getElementById("lista");

            lista.innerHTML = "";


            for (let i = 0; i < elementos.length; i++) {

                let li = document.createElement("li");


                let texto = document.createElement("span");

                texto.textContent = elementos[i].texto;


                let boton = document.createElement("button");

                boton.textContent = "Eliminar";


                boton.onclick = function() {

                    eliminar(elementos[i].id);

                };


                li.appendChild(texto);

                li.appendChild(boton);

                lista.appendChild(li);

            }

        }


        // Agregar tarea

        function agregar() {

            let texto = document.getElementById("texto").value;


            if (texto != "") {

                tareasRef.push({

                    texto: texto

                });


                document.getElementById("texto").value = "";

            }

        }


        // Eliminar tarea

        function eliminar(id) {

            tareasRef.child(id).remove();

        }


        // Cuando se agrega una tarea

        tareasRef.on("child_added", function(snapshot) {

            let tarea = {

                id: snapshot.key,

                texto: snapshot.val().texto

            };


            let existe = elementos.find(function(elemento) {

                return elemento.id === tarea.id;

            });


            if (!existe) {

                elementos.push(tarea);

                guardarLocal();

                mostrar();

            }

        });


        // Cuando se elimina una tarea

        tareasRef.on("child_removed", function(snapshot) {

            let id = snapshot.key;


            elementos = elementos.filter(function(elemento) {

                return elemento.id != id;

            });


            guardarLocal();

            mostrar();

        });


        // Guardar en LocalStorage

        function guardarLocal() {

            localStorage.setItem(
                "elementos",
                JSON.stringify(elementos)
            );

        }

        // Registrar Service Worker

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register("wifioff.js");

        }
    </script>
</body>
</html>
