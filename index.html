<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Lista</title>

    <link rel="manifest" href="implementacion.json">

</head>


<body>

    <!-- Pantalla de usuario -->

    <div id="pantallaUsuario" class="contenedor">

        <h1>Mi Lista</h1>

        <p>Ingresa tu usuario</p>

        <input
            type="text"
            id="usuario"
            placeholder="Nombre de usuario"
        >

        <button onclick="entrar()">
            Entrar
        </button>

    </div>


    <!-- Pantalla de tareas -->

    <div id="pantallaTareas" class="contenedor" style="display: none;">

        <h1>Mi Lista</h1>

        <p>
            Usuario:
            <strong id="nombreUsuario"></strong>
        </p>


        <div class="entrada">

            <input
                type="text"
                id="texto"
                placeholder="Escribe una tarea"
            >

            <button onclick="agregar()">
                Agregar
            </button>

        </div>


        <ul id="lista"></ul>


        <p id="estado">
            Conectando...
        </p>


        <button onclick="salir()">
            Cerrar sesión
        </button>

    </div>


    <style>

        body {

            font-family: Arial, sans-serif;

            margin: 0;

            padding: 20px;

            background-color: #f2f2f2;

        }


        .contenedor {

            max-width: 600px;

            margin: 40px auto;

            background-color: white;

            padding: 20px;

            border-radius: 10px;

        }


        input {

            box-sizing: border-box;

            width: 100%;

            padding: 10px;

            margin-bottom: 10px;

            font-size: 16px;

        }


        button {

            padding: 10px 15px;

            cursor: pointer;

            margin-bottom: 10px;

        }


        .entrada {

            display: flex;

            gap: 10px;

        }


        .entrada input {

            margin-bottom: 0;

        }


        .entrada button {

            white-space: nowrap;

        }


        ul {

            padding: 0;

            list-style: none;

        }


        li {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 10px;

            margin-top: 10px;

            background-color: #eeeeee;

            border-radius: 5px;

        }


        li button {

            margin: 0;

        }


        #estado {

            font-size: 14px;

        }


        @media (max-width: 500px) {

            .entrada {

                flex-direction: column;

            }


            li {

                flex-direction: column;

                gap: 10px;

                align-items: stretch;

            }

        }

    </style>


    <!-- Firebase -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


    <script>

        // Configuración de Firebase

        const firebaseConfig = {

            apiKey: "AIzaSyATiJwpfYrsnEbVGtnuZxklN-XFUs7szjw",

            authDomain: "ejerciciopruebaa.firebaseapp.com",

            databaseURL: "https://ejerciciopruebaa-default-rtdb.firebaseio.com",

            projectId: "ejerciciopruebaa",

            storageBucket: "ejerciciopruebaa.firebasestorage.app",

            messagingSenderId: "936617415497",

            appId: "1:936617415497:web:82324a47c68c73f4a88098"

        };


        // Iniciar Firebase

        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();


        // Usuario actual

        let usuarioActual = localStorage.getItem("usuarioActual");


        // Referencia de las tareas

        let tareasRef = null;


        // Mostrar usuario guardado

        if (usuarioActual) {

            iniciarAplicacion();

        }


        // Entrar

        function entrar() {

            let usuario = document
                .getElementById("usuario")
                .value
                .trim();


            if (usuario == "") {

                alert("Escribe un usuario.");

                return;

            }


            localStorage.setItem(
                "usuarioActual",
                usuario
            );


            usuarioActual = usuario;


            iniciarAplicacion();

        }


        // Iniciar aplicación

        function iniciarAplicacion() {

            document
                .getElementById("pantallaUsuario")
                .style.display = "none";


            document
                .getElementById("pantallaTareas")
                .style.display = "block";


            document
                .getElementById("nombreUsuario")
                .textContent = usuarioActual;


            // Crear referencia exclusiva para este usuario

            tareasRef = db
                .ref("usuarios")
                .child(usuarioActual)
                .child("tareas");


            escucharTareas();

        }


        // Escuchar tareas de Firebase

        function escucharTareas() {

            tareasRef.off();


            tareasRef.on("value", function(snapshot) {

                let lista = document.getElementById("lista");

                lista.innerHTML = "";


                if (!snapshot.exists()) {

                    return;

                }


                snapshot.forEach(function(hijo) {

                    let tarea = hijo.val();


                    let li = document.createElement("li");


                    let texto = document.createElement("span");

                    texto.textContent = tarea.texto;


                    let boton = document.createElement("button");

                    boton.textContent = "Eliminar";


                    boton.onclick = function() {

                        eliminar(hijo.key);

                    };


                    li.appendChild(texto);

                    li.appendChild(boton);

                    lista.appendChild(li);

                });

            });

        }


        // Agregar tarea

        function agregar() {

            let texto = document
                .getElementById("texto")
                .value
                .trim();


            if (texto == "") {

                return;

            }


            tareasRef.push({

                texto: texto,

                fecha: Date.now()

            });


            document
                .getElementById("texto")
                .value = "";

        }


        // Eliminar tarea

        function eliminar(id) {

            tareasRef
                .child(id)
                .remove();

        }


        // Cerrar sesión

        function salir() {

            localStorage.removeItem("usuarioActual");

            usuarioActual = null;

            tareasRef = null;


            document
                .getElementById("pantallaTareas")
                .style.display = "none";


            document
                .getElementById("pantallaUsuario")
                .style.display = "block";


            document
                .getElementById("usuario")
                .value = "";

        }


        // Detectar conexión

        const conexionRef = db.ref(".info/connected");


        conexionRef.on("value", function(snapshot) {

            let estado =
                document.getElementById("estado");


            if (estado) {

                if (snapshot.val() === true) {

                    estado.textContent = "Conectado";

                } else {

                    estado.textContent = "Sin conexión";

                }

            }

        });


        // Registrar Service Worker

        if ("serviceWorker" in navigator) {

            navigator.serviceWorker.register("wifioff.js");

        }

    </script>

</body>

</html>
